<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;background:#f2f2f7;color:#111827}
.head{padding:60px 20px 8px}
.date{font-size:13px;font-weight:600;color:#6b7280;text-transform:uppercase}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.cta{margin:12px 20px;height:52px;border-radius:14px;background:#0a84ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600}
.label{margin:22px 20px 8px;font-size:13px;color:#6b7280;text-transform:uppercase}
.group{margin:0 16px;background:#fff;border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #e5e7eb}
.item:last-child{border:0}
.dot{width:36px;height:36px;border-radius:10px;background:#e0efff}
.t{flex:1}.t b{display:block;font-size:16px;font-weight:600}.t span{font-size:13px;color:#6b7280}
.badge{font-size:12px;font-weight:600;padding:4px 8px;border-radius:999px;background:#dcfce7;color:#15803d}
.badge.b{background:#e0efff;color:#0a84ff}
.bar{width:90px;height:6px;border-radius:9px;background:#e5e7eb;overflow:hidden}.bar i{display:block;height:100%;background:#0a84ff}
.tabs{position:absolute;bottom:0;left:0;right:0;height:84px;background:rgba(255,255,255,.92);border-top:1px solid #e5e7eb;display:flex;padding-top:8px}
.tabs div{flex:1;text-align:center;font-size:10px;font-weight:500;color:#9ca3af}
.tabs div i{display:block;width:26px;height:26px;margin:0 auto 3px;border-radius:50%;background:#d1d5db}
.tabs .on{color:#0a84ff}.tabs .on i{background:#0a84ff}
</style></head><body>
<div class="head"><div class="date">Domenica 25 ottobre</div><h1>Attività</h1></div>
<div class="cta">Nuova uscita</div>
<div class="label">Oggi</div>
<div class="group">
  <div class="item"><div class="dot"></div><div class="t"><b>Isola Lachea</b><span>09:30–11:00 · 3 subacquei</span></div><span class="badge">Vista</span></div>
  <div class="item"><div class="dot"></div><div class="t"><b>Panettoni</b><span>15:00–16:30 · 6 subacquei</span></div><span class="badge b">Inviata</span></div>
</div>
<div class="label">Posti liberi oggi</div>
<div class="group">
  <div class="item"><div class="t"><b>Isola Lachea</b><span>0 di 12</span></div><div class="bar"><i style="width:100%"></i></div></div>
  <div class="item"><div class="t"><b>Panettoni</b><span>8 di 20</span></div><div class="bar"><i style="width:60%"></i></div></div>
  <div class="item"><div class="t"><b>Faraglione Grande</b><span>15 di 15</span></div><div class="bar"><i style="width:0%"></i></div></div>
</div>
<div class="tabs"><div><i></i>Segnala</div><div class="on"><i></i>Attività</div><div><i></i>Mappa</div><div><i></i>AMP</div></div>
</body></html>
