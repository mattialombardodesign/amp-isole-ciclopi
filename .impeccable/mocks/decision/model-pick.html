.chart{position:absolute;inset:0 0 300px 0;background:#fff}

.grid{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border:1px solid #111418}
.grid div{padding:8px 10px;border-right:1px solid #111418}
.grid div:last-child{border:0}

.btn{margin-top:14px;height:50px;background:#111418;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.tabs{position:absolute;bottom:0;left:0;right:0;height:84px;border-top:1.5px solid #111418;display:flex;padding-top:10px;background:#fff}

.tabs div i{display:block;width:24px;height:24px;margin:0 auto 4px;border:1.5px solid #9ca3af;border-radius:50%}
.tabs .on{color:#111418}.tabs .on i{background:#2f6fb0;border-color:#2f6fb0}
